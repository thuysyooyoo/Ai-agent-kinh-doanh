<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eureka Logistics — Ước Tính Giá Khai Báo 1 Sổ</title>
  <meta name="description" content="Công cụ ước tính giá khai báo và giá xuất hóa đơn theo phương pháp 1 sổ cho hàng ủy thác gom cont (LCL) và nguyên cont (FCL) — Eureka Logistics 2026">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- PWA Meta and Links -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8734a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eureka 1 Sổ">
  <link rel="apple-touch-icon" href="logo.jpg">
  
  <link rel="stylesheet" href="style.css?v=2.2.0">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      if (message === 'Script error.' || lineno === 0 || !source) {
        console.warn('[CORS / External Script Warning]:', message, 'at', source);
        return false;
      }
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = '#fee2e2';
      div.style.color = '#991b1b';
      div.style.padding = '12px 20px';
      div.style.zIndex = '999999';
      div.style.borderBottom = '3px solid #f87171';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '14px';
      div.style.fontWeight = 'bold';
      div.style.boxShadow = '0 4px 10px rgba(0,0,0,0.3)';
      div.innerHTML = `[Lỗi JS] ${message}<br>File: ${source}<br>Dòng: ${lineno}:${colno}`;
      document.body.appendChild(div);
      return false;
    };
  </script>
  <!-- SheetJS & Docx (Cần thiết cho xuất Excel & Word) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
</head>
<body style="min-height:100vh; background:var(--bg-light, #fdf8f4); margin:0; padding:0;">

  <!-- ═══ MÀN HÌNH ĐĂNG NHẬP (DUY NHẤT TRÊN FRONTEND KHI CHƯA ĐĂNG NHẬP) ═══ -->
  <div id="login-overlay" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="section-card animate-in" style="width:100%; max-width:400px; box-shadow:var(--shadow-lg); border:1px solid var(--border-accent);">
      <div class="section-header" style="justify-content:center; flex-direction:column; padding:30px 20px 20px; background:var(--bg-card-alt); border-bottom:none;">
        <img src="logo.jpg" alt="Eureka Logistics" style="width:60px; height:60px; border-radius:12px; margin-bottom:12px; border:2px solid var(--border);">
        <div class="section-title" style="font-size:1.3rem; text-align:center;">EUREKA LOGISTICS</div>
        <div class="section-desc" style="text-align:center;">Hệ thống Ước Tính Chi Phí và Giá Khai Báo 1 Sổ</div>
      </div>
      <div class="section-body" style="padding:24px;">
        <form id="login-form" onsubmit="return false;" style="display:flex; flex-direction:column; gap:16px;">
          <div class="form-group">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" id="login-username" class="form-input" required placeholder="Nhập tên đăng nhập" autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="login-password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
          </div>
          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="margin-top:8px;">Đăng Nhập</button>
        </form>
        <div id="login-error-msg" style="color:var(--danger); font-size:0.8rem; font-weight:600; text-align:center; margin-top:12px; display:none;">
          Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ APP WORKSPACE ROOT (HOÀN TOÀN RỖNG KHI CHƯA ĐĂNG NHẬP) ═══ -->
  <div id="app-root" style="display:none;"></div>

  <!-- Supabase Auth Core -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Encrypted Vault Data & Gatekeeper -->
  <script src="vault.data.js?v=2.2.0"></script>
  <script src="vault-gate.js?v=2.2.0"></script>
</body>
</html>
